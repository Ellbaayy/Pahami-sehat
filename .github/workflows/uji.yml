# Integrasi berkelanjutan — Pahami Sehat
#
# Semua uji di sini berjalan TANPA jaringan dan TANPA API key, kecuali langkah
# pemasangan dependensi. Itu syaratnya: uji yang butuh kunci rahasia tidak boleh
# jadi penentu pada pull request dari orang lain.
#
# URUTAN PENTING: dependensi dipasang LEBIH DULU. `uji-ocr.mjs` mengimpor
# `app/src/lib/ocr.js`, yang mengimpor `tesseract.js` — tanpa node_modules uji
# itu gagal dengan ERR_MODULE_NOT_FOUND, bukan karena kodenya salah.
#
# Yang TIDAK dijalankan di sini, dan alasannya disebut apa adanya:
#   - uji-jawaban.mjs  -> butuh server lokal + KENARI_API_KEY (rahasia)
#   - uji-sumber.mjs --jaringan, ukur-*, verifikasi-judul.mjs, periksa-istilah.mjs
#     -> butuh jaringan ke Wikipedia/MedlinePlus; jaringannya bisa berubah dan
#        membuat CI merah padahal kode kita tidak salah. Dijalankan manual.
#   - mesin OCR, pengenalan suara, pemutaran suara, papan klip, mode Inggris
#     -> butuh peramban sungguhan, diuji manual (lihat README).

name: uji

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  uji:
    name: Uji tanpa jaringan
    runs-on: ubuntu-latest
    steps:
      # v7, bukan v4 (dinaikkan 25 Okt 2026). Runner sudah menandai v4 karena
      # masih menargetkan Node 20 yang deprecated, dan memaksanya jalan di
      # Node 24 — peringatan itu akan berubah jadi kegagalan suatu hari.
      # Diperiksa sebelum naik: `using: node24` di kedua action, dan semua
      # input yang dipakai di bawah (node-version, cache, cache-dependency-path)
      # masih ada di action.yml v7.
      #
      # `package-manager-cache` di setup-node v7 menyala otomatis HANYA kalau
      # package.json punya `packageManager`/`devEngines` — `app/package.json`
      # tidak punya keduanya, jadi tidak ada cache ganda dengan `cache: npm`.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Pasang dependensi
        working-directory: app
        # --ignore-scripts WAJIB di sini, dan bukan sekadar kehati-hatian.
        #
        # `msedge-tts` memasang `preinstall: npx only-allow pnpm`, yang
        # KELUAR DENGAN KODE 1 bila dijalankan oleh npm (diukur: exit 1 di
        # bawah npm, exit 0 hanya di bawah pnpm). npm versi 11 ke atas
        # melewatkan install script secara bawaan sehingga ini tidak terasa di
        # komputer pengembang — tetapi runner GitHub memakai npm 10 dan
        # MENJALANKANNYA, jadi tanpa flag ini `npm ci` gagal.
        #
        # Aman untuk build: tidak satu pun dependensi yang dipakai saat build
        # (vite, @vitejs/plugin-react, tailwindcss) memerlukan install script.
        # Skrip milik tesseract.js hanya mencetak ajakan donasi.
        run: npm ci --include=dev --ignore-scripts

      - name: Periksa sintaks berkas server
        run: node --check app/server/*.js app/api/*.js

      - name: Lint (ESLint)
        # Gerbang mutu kode. Yang dijaga di sini BUKAN gaya penulisan,
        # melainkan kesalahan yang tidak terlihat dari build hijau: variabel
        # mati, kunci kamus dobel (nilai terakhir diam-diam menimpa yang
        # pertama, tanpa galat dan tanpa gagal uji), dan penulisan state
        # setelah await yang bisa balapan.
        working-directory: app
        run: npm run lint

      - name: Uji batas panjang & laju rute
        run: node uji-batas.mjs

      - name: Uji penarikan konten dari HTML
        run: node uji-ekstrak.mjs

      - name: Uji pencocokan kata kunci topik
        run: node uji-kata-kunci.mjs

      - name: Uji perapian teks & pemotongan kalimat
        run: node uji-teks.mjs

      - name: Uji perapian teks OCR & penandaan angka
        run: node uji-ocr.mjs

      - name: Uji kesehatan kamus id/en
        run: node uji-bahasa.mjs

      - name: Uji tingkat baca (server & klien sepakat)
        # Tanpa jaringan. Menjaga dua hal yang dulu tidak terlihat dari build
        # hijau: (1) `TINGKAT_DEFAULT` di server dan di klien harus sama, dan
        # (2) bawaannya tidak boleh kembali ke 'anak'. Diukur 5 Nov 2026:
        # permintaan tanpa field `tingkat` dijawab dengan gaya pembaca 9–11
        # tahun (578 karakter) — pengguna yang tidak memilih tingkat tidak
        # sedang meminta versi anak-anak.
        run: node uji-tingkat.mjs

      - name: Uji dokumentasi (angka README = isi repo)
        # Menghitung langsung dari folder: jumlah uji, tangkapan layar, berkas
        # server, dan memastikan setiap uji yang dijalankan `npm test` disebut
        # README. Tanpa ini, menambah satu uji atau satu tangkapan layar membuat
        # angka di dokumen utama diam-diam ketinggalan.
        run: node uji-dokumentasi.mjs

      - name: Uji jalur berita (deteksi, parser RSS, penetrasi)
        # Parser RSS makan data dari pihak luar. Uji ini membuktikan injeksi
        # prompt lewat judul/deskripsi, skema link aneh, feed raksasa/rusak,
        # dan tanggal ngawur semuanya tertahan di lapis parser. Bagian "live"
        # (RSS sungguhan) otomatis dilewati di CI kalau sumbernya tak terjangkau —
        # jangan menjadikannya wajib-lulus.
        run: node uji-berita.mjs

      - name: Uji jam acuan (tanpa jaringan)
        # Penjadwalan "sekali sehari" memakai jam internet (header Date respons),
        # bukan jam mesin. Uji ini membuktikan header ngawur ditolak, header sah
        # dibaca, dan waktunya tetap maju — semuanya tanpa jaringan.
        run: node uji-jam.mjs

      - name: Uji rotasi daftar konten (tanpa jaringan)
        # Selama sumbernya belum menerbitkan artikel baru, `susun()` selalu
        # mengambil 5 teratas — jadi halaman menampilkan lima artikel yang sama
        # berhari-hari. Rotasi menutup celah itu. Uji ini menjaga agar yang
        # tampil benar-benar bergeser, tetap 5/4/1, dan TIDAK PERNAH keluar dari
        # artikel yang memang ada di pool (tidak ada yang dikarang).
        run: node uji-rotasi.mjs

      - name: Uji tanggal terbit konten (tanpa jaringan)
        # KENAPA ADA (25 Okt 2026): dua keluhan nyata. (1) Halaman menampilkan
        # "Diperbarui 12 Oktober 2026" — itu kapan DAFTAR artikel berubah, bukan
        # tanggal terbit apa pun. (2) Artikel 2025 tampil di atas artikel 2026
        # karena tanggal terbitnya tidak pernah diambil dari sumber.
        #
        # Uji ini menjaga: parser `itemprop="datePublished"` (bulan Indonesia DAN
        # Inggris — sumbernya campur), tanggal ngawur DITOLAK bukan ditebak,
        # artikel tanpa tanggal tidak pernah di depan, dan rotasi hanya berputar
        # di dalam jendela artikel terbaru (diukur: tanpa jendela, `geser` 6-8
        # mengangkat artikel 2023 ke baris pertama).
        run: node uji-tanggal-konten.mjs

      - name: Uji pengurai sumber konten
        # Sumber konten harian berganti 1 Nov 2026 (rilis berita Kemenkes +
        # kanal kesehatan CNN Indonesia), dan kedua bentuk HTML-nya tidak
        # memakai `itemprop="datePublished"` lagi. Uji ini menjaga: judul,
        # tautan, thumbnail, dan tanggal kedua sumber terbaca; tautan paginasi
        # tidak ikut jadi artikel; tanggal ngawur (termasuk bentuk ISO 31 Feb)
        # tetap ditolak; dan kartu CNN tidak pernah berlabel "Kemenkes RI".
        run: node uji-sumber-konten.mjs

      - name: Uji alat ukur keterbacaan
        # Alat ukur yang salah menghasilkan kesimpulan yang salah dengan sangat
        # meyakinkan. Uji ini memakai kata yang jumlah suku katanya bisa
        # dihitung manusia, dan memastikan daftar berbutir TIDAK dihitung
        # sebagai satu kalimat raksasa (pernah terjadi: satu jawaban dilaporkan
        # 56 kata per kalimat padahal itu daftar langkah).
        run: node uji-keterbacaan.mjs

      - name: Uji lapis sumber (tanpa jaringan)
        run: node uji-sumber.mjs

      - name: Uji ejaan & nada suara (tanpa jaringan)
        # Menjaga pembagian singkatan yang DIEJA dan yang TIDAK. Setiap anggota
        # kedua kelompok diuji satu per satu, jadi menambah/mengurangi daftarnya
        # tanpa mengukur ulang akan langsung gagal.
        run: node uji-suara.mjs

      - name: Uji jejak sitasi
        # Bagian "murni" (aturan penolakan URL) selalu jalan. Bagian yang butuh
        # MariaDB DILEWATI dengan exit 0 kalau database tidak ada — database
        # memang opsional, jadi CI tidak boleh merah karenanya.
        run: node uji-sitasi.mjs

      - name: Uji penyaring klaim prognosis
        # Tanpa jaringan, model, dan DB. Menjaga agar penyaring TIDAK membuang
        # kalimat yang benar; pemeriksaan "jangan dibuang" sengaja lebih banyak
        # daripada "harus dibuang".
        #
        # KENAPA BARU DITAMBAHKAN (2 Nov 2026): uji ini sudah lama ada dan hijau
        # di laptop, tetapi TIDAK PERNAH dijalankan CI — 43 pemeriksaannya tidak
        # menjaga apa pun di runner. Persis hijau palsu yang pernah terjadi pada
        # uji-tanggal-konten.
        run: node uji-klaim.mjs

      - name: Uji konteks percakapan
        # Tanpa jaringan/DB/kunci. Menjaga riwayat sesi tetap dipakai sebagai
        # konteks, pertanyaan lanjutan tetap dikenali, dan sapaan tidak
        # tertangkap sebagai lanjutan. Sama seperti di atas: sudah ada sejak
        # lama, tetapi belum pernah masuk CI (49 pemeriksaan).
        run: node uji-konteks.mjs

      - name: Uji lapisan fasilitas kesehatan (kategori, koordinat, duplikat)
        # Tanpa jaringan: kategori OSM dipetakan ke 10 kategori yang diminta,
        # koordinat rusak ditolak, IGD/24 jam tidak dikarang, duplikat digabung.
        # Pemanggilan Overpass sungguhan sengaja TIDAK di sini: runner CI tidak
        # punya internet, dan uji tanpa jaringan tidak boleh menyentuh layanan
        # pihak ketiga.
        run: node uji-faskes.mjs

      - name: Uji wilayah administratif (kode, normalisasi, cascade titik)
        # Tanpa jaringan: validasi bentuk kode per tingkat, turunan kode induk,
        # pemilihan hasil Nominatim (menolak kavling/sekolah/polsek), dan
        # cascade desa -> kecamatan -> kabupaten -> provinsi.
        run: node uji-wilayah.mjs

      - name: Uji penyimpanan fasilitas (MySQL, dilewati bila DB mati)
        # Runner CI tidak punya MySQL, jadi langkah ini akan mencetak DILEWATI
        # dan keluar 0 — itu memang perilaku yang diinginkan: database OPSIONAL.
        # Saat dijalankan di laptop dengan XAMPP hidup, uji ini memeriksa skema,
        # upsert idempoten, NULL (bukan string kosong), injeksi, dan kedaluwarsa.
        run: node uji-faskes-db.mjs

      - name: Uji rumah sakit SIRS (jumlah, wilayah, koordinat, filter)
        # Butuh MariaDB; uji ini melewati bagian database kalau DB tidak ada,
        # tetapi di CI service MySQL disediakan supaya benar-benar diperiksa.
        run: node uji-rs-sirs.mjs

      - name: Uji geocoding alamat + deteksi wilayah
        # Tanpa jaringan: `address` Nominatim nyata dikutip di dalam uji.
        run: node uji-geocoding.mjs

      - name: Uji rute perjalanan (moda, polyline, terjemahan instruksi)
        # Tanpa jaringan: pemetaan moda ke costing Valhalla (tiga moda, tiga
        # costing berbeda), decoder polyline6, terjemahan instruksi, dan tautan
        # Google Maps. OSRM demo sengaja tidak dipakai: semua profilnya identik.
        run: node uji-rute-perjalanan.mjs

      - name: Uji halaman penjelasan (enam kartu, tangkapan layar termuat)
        # Butuh peramban + server. Membuktikan halaman depan benar-benar
        # menampilkan enam kartu fitur dan ketiga tangkapan layar termuat
        # (naturalWidth > 0), bukan hanya <img> yang terpasang.
        run: |
          npm --prefix app run build
          node app/server/index.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/api/health >/dev/null && break
            sleep 1
          done
          node uji-halaman-penjelasan.mjs

      - name: Uji lapisan server (kompresi, 404 JSON, galat klien)
        # Tanpa jaringan dan tanpa rahasia: server asli dinyalakan di port acak.
        # Yang diuji bukan fitur, melainkan hal yang SALAHNYA tidak terlihat dari
        # build hijau: respons besar dikompresi, JSON rusak dijawab 400 (bukan
        # 500), dan /api/* yang tidak ada membalas JSON - bukan halaman HTML
        # Express yang menyebut nama kerangkanya.
        run: node uji-server.mjs

      - name: Build produksi
        working-directory: app
        run: npm run build

      - name: Uji penyajian berkas statis (kompresi & cache)
        # HARUS SESUDAH build: uji ini memeriksa `dist/` yang sungguhan.
        # Yang dijaga di sini adalah hal yang tidak terlihat dari build hijau
        # maupun dari uji lain: '/app/' bisa menyajikan halaman yang SALAH dan
        # tetap HTTP 200, dan berkas hasil build bisa terkirim tanpa kompresi
        # sambil tetap tampak wajar di peramban.
        run: node uji-statis.mjs

      - name: Uji skor HLS-SF12 (indeks 0-50 & empat kategori)
        # Tanpa jaringan. Yang dijaga: rumus indeks dan batas kategori, supaya
        # skor tidak diam-diam kembali menjadi persentase buatan sendiri.
        run: node uji-skor-hls.mjs

      - name: Uji peramban otomatis (6 halaman × 2 bahasa)
        # Satu-satunya uji yang memeriksa LAYAR, bukan kode: judul halaman
        # tampil, tepat satu h1, tanpa luapan horizontal di 1280x800 dan
        # 375x812, tanpa galat runtime — untuk 6 halaman × 2 bahasa.
        #
        # Butuh server hidup dan Chrome. Runner ubuntu-latest sudah membawa
        # google-chrome-stable, jadi langkah ini benar-benar menguji. Kunci
        # model DIPALSUKAN dan DB dimatikan: uji ini tidak pernah memanggil
        # model maupun database, jadi tidak boleh bergantung pada rahasia.
        #
        # Kalau server gagal siap, langkah ini SENGAJA exit 1 (bukan membiarkan
        # uji melaporkan DILEWATI) — di CI, "dilewati" berarti hijau palsu.
        run: |
          cd app
          KENARI_API_KEY=uji-tanpa-kunci-asli DB_MATI=1 nohup node server/index.js > /tmp/srv.log 2>&1 &
          siap=0
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8787/app/; then siap=1; break; fi
            sleep 1
          done
          if [ "$siap" != "1" ]; then
            echo "Server tidak siap untuk uji peramban:"
            tail -40 /tmp/srv.log
            exit 1
          fi
          cd ..
          node uji-peramban.mjs

