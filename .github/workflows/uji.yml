# Integrasi berkelanjutan — Pahami Sehat
#
# Semua uji di sini berjalan TANPA jaringan dan TANPA API key, kecuali langkah
# pemasangan dependensi. Itu syaratnya: uji yang butuh kunci rahasia tidak boleh
# jadi penentu pada pull request dari orang lain.
#
# URUTAN PENTING: dependensi dipasang LEBIH DULU. `uji-ocr.mjs` mengimpor
# `app/src/lib/ocr.js`, yang mengimpor `tesseract.js` — tanpa node_modules uji
# itu gagal dengan ERR_MODULE_NOT_FOUND, bukan karena kodenya salah.
#
# Yang TIDAK dijalankan di sini, dan alasannya disebut apa adanya:
#   - uji-jawaban.mjs  -> butuh server lokal + KENARI_API_KEY (rahasia)
#   - uji-sumber.mjs --jaringan, ukur-*, verifikasi-judul.mjs, periksa-istilah.mjs
#     -> butuh jaringan ke Wikipedia/MedlinePlus; jaringannya bisa berubah dan
#        membuat CI merah padahal kode kita tidak salah. Dijalankan manual.
#   - mesin OCR, pengenalan suara, pemutaran suara, papan klip, mode Inggris
#     -> butuh peramban sungguhan, diuji manual (lihat README).

name: uji

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  uji:
    name: Uji tanpa jaringan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Pasang dependensi
        working-directory: app
        # --ignore-scripts WAJIB di sini, dan bukan sekadar kehati-hatian.
        #
        # `msedge-tts` memasang `preinstall: npx only-allow pnpm`, yang
        # KELUAR DENGAN KODE 1 bila dijalankan oleh npm (diukur: exit 1 di
        # bawah npm, exit 0 hanya di bawah pnpm). npm versi 11 ke atas
        # melewatkan install script secara bawaan sehingga ini tidak terasa di
        # komputer pengembang — tetapi runner GitHub memakai npm 10 dan
        # MENJALANKANNYA, jadi tanpa flag ini `npm ci` gagal.
        #
        # Aman untuk build: tidak satu pun dependensi yang dipakai saat build
        # (vite, @vitejs/plugin-react, tailwindcss) memerlukan install script.
        # Skrip milik tesseract.js hanya mencetak ajakan donasi.
        run: npm ci --include=dev --ignore-scripts

      - name: Periksa sintaks berkas server
        run: node --check app/server/*.js app/api/*.js

      - name: Uji batas panjang & laju rute
        run: node uji-batas.mjs

      - name: Uji penarikan konten dari HTML
        run: node uji-ekstrak.mjs

      - name: Uji pencocokan kata kunci topik
        run: node uji-kata-kunci.mjs

      - name: Uji perapian teks & pemotongan kalimat
        run: node uji-teks.mjs

      - name: Uji perapian teks OCR & penandaan angka
        run: node uji-ocr.mjs

      - name: Uji kesehatan kamus id/en
        run: node uji-bahasa.mjs

      - name: Uji jalur berita (deteksi, parser RSS, penetrasi)
        # Parser RSS makan data dari pihak luar. Uji ini membuktikan injeksi
        # prompt lewat judul/deskripsi, skema link aneh, feed raksasa/rusak,
        # dan tanggal ngawur semuanya tertahan di lapis parser. Bagian "live"
        # (RSS sungguhan) otomatis dilewati di CI kalau sumbernya tak terjangkau —
        # jangan menjadikannya wajib-lulus.
        run: node uji-berita.mjs

      - name: Uji alat ukur keterbacaan
        # Alat ukur yang salah menghasilkan kesimpulan yang salah dengan sangat
        # meyakinkan. Uji ini memakai kata yang jumlah suku katanya bisa
        # dihitung manusia, dan memastikan daftar berbutir TIDAK dihitung
        # sebagai satu kalimat raksasa (pernah terjadi: satu jawaban dilaporkan
        # 56 kata per kalimat padahal itu daftar langkah).
        run: node uji-keterbacaan.mjs

      - name: Uji lapis sumber (tanpa jaringan)
        run: node uji-sumber.mjs

      - name: Uji ejaan & nada suara (tanpa jaringan)
        # Menjaga pembagian singkatan yang DIEJA dan yang TIDAK. Setiap anggota
        # kedua kelompok diuji satu per satu, jadi menambah/mengurangi daftarnya
        # tanpa mengukur ulang akan langsung gagal.
        run: node uji-suara.mjs

      - name: Uji jejak sitasi
        # Bagian "murni" (aturan penolakan URL) selalu jalan. Bagian yang butuh
        # MariaDB DILEWATI dengan exit 0 kalau database tidak ada — database
        # memang opsional, jadi CI tidak boleh merah karenanya.
        run: node uji-sitasi.mjs

      - name: Uji akun (kata sandi, sesi, normalisasi)
        # Fitur akun menyimpan kata sandi, jadi yang diuji bukan "apakah bisa
        # masuk" melainkan: sandi tidak pernah tersimpan apa adanya, dua sandi
        # sama menghasilkan hash berbeda (salt), pesan galat masuk tidak
        # membedakan "akun tidak ada" dari "sandi salah", dan token sesi
        # disimpan sebagai hash. Butuh MariaDB; bagian itu dilewati di CI.
        run: node uji-akun.mjs

      - name: Build produksi
        working-directory: app
        run: npm run build
